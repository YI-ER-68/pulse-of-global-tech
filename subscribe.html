<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>订阅时讯 · 每 2 小时全球科技推送</title>
<style>
body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{max-width:480px;width:100%;background:#161b22;border:1px solid #2d333b;border-radius:16px;padding:32px;}
h1{font-size:22px;margin:0 0 8px;}
p{color:#9da7b3;font-size:14px;line-height:1.6;}
.path{background:#0d1117;border:1px solid #2d333b;border-radius:12px;padding:18px;margin:18px 0;}
.ptitle{font-size:15px;font-weight:700;color:#e6edf3;margin-bottom:6px;}
.pdesc{font-size:13px;color:#9da7b3;margin:0 0 14px;line-height:1.6;}
form{display:flex;gap:10px;}
input{flex:1;background:#161b22;border:1px solid #2d333b;border-radius:10px;color:#e6edf3;padding:12px 14px;font-size:15px;outline:none;}
input:focus{border-color:#58a6ff;}
.btn{display:inline-block;text-align:center;background:#3ddc84;color:#0f1117;border:none;border-radius:10px;font-weight:700;padding:12px 22px;font-size:15px;cursor:pointer;text-decoration:none;}
.btn:hover{filter:brightness(1.08);}
.btn.block{display:block;width:100%;box-sizing:border-box;}
button.btn{cursor:pointer;}
.tip{font-size:12px;margin-top:16px;color:#9da7b3;}
a{color:#58a6ff;text-decoration:none;}
</style></head>
<body>
<div class="box">
  <h1>🌐 订阅「时讯」</h1>
  <p>每 2 小时一期，全球科技 / AI 资讯精炼后推送到你的邮箱。二选一即可订阅。</p>

  <div class="path">
    <div class="ptitle">方式一 · 问卷订阅（推荐）</div>
    <p class="pdesc">点开腾讯问卷填邮箱，提交后自动进入名单，下一期即收到。零配置、最省事。</p>
    <a class="btn block" href="https://wj.qq.com/s2/27435171/cpw5/" target="_blank" rel="noopener">📝 免费订阅（腾讯问卷）</a>
  </div>

  <div class="path">
    <div class="ptitle">方式二 · 邮箱直订</div>
    <p class="pdesc">留邮箱点提交，会用你的邮件客户端给作者发一封订阅信，作者收到即手动添加。</p>
    <form id="mailsub">
      <input type="email" id="email" required placeholder="你的邮箱">
      <button type="submit" class="btn">提交订阅</button>
    </form>
  </div>

  <p class="tip">不发垃圾邮件，随时可退订。</p>
</div>
<script>
document.getElementById('mailsub').addEventListener('submit', function(e){
  e.preventDefault();
  var email=document.getElementById('email').value.trim();
  if(!email){ return; }
  var addr="yi_er_m@126.com";
  var subj=encodeURIComponent("订阅 时讯");
  var body=encodeURIComponent("我的邮箱：" + email + "\n请订阅「时讯」。");
  window.location.href="mailto:" + addr + "?subject=" + subj + "&body=" + body;
});
</script>
</body></html>
